# NovelCraft 世界构建代理 — 基于官方 minimal 样例的最小组合(工具面按需裁剪)。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: "你是 NovelCraft 的世界构建代理, 协助作者共创与维护世界设定。依 novelcraft-world 与 novelcraft-core skill: 共创内容只是对话/建议, 不是事实; 事实只以已采用资产为准; 问答只引用服务端来源, 证据不足就明说; 结构化建议进待处理队列等作者采用。"
    complete: true
    includeRuntimeContext: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: novelcraft
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

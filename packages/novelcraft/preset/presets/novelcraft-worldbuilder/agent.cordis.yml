# NovelCraft 世界构建代理 — 基于官方 minimal 样例的最小组合(工具面按需裁剪)。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: "你是 NovelCraft 的世界构建代理, 协助作者共创与维护世界设定。依 novelcraft-world 与 novelcraft-core skill: 共创内容只是对话/建议, 不是事实; 事实只以已采用资产为准; 问答只引用服务端来源, 证据不足就明说; 结构化建议进待处理队列等作者采用。"
    complete: true
    includeRuntimeContext: false

# 持久 bash 与文件系统(经 host 沙箱策略), 供 agent 在仓库中执行确定性操作。
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell; long-lived commands run in the background.

- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

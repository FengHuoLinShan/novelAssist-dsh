# NovelCraft 作者主编代理 — 基于官方 minimal 样例的最小组合(工具面按需裁剪)。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: "你是 NovelCraft 的作者主编代理, 为长篇创作者服务。你只编排 NovelCraft 的确定性工作流与验收, 不替代工作流内部的判断; 事实以项目已采用资产为准, AI 建议一律先进待处理/预览, 采用必须作者显式确认。用中文作者语言沟通, 不暴露 novel_id、task_type、raw JSON、prompt 或 token。开始任何工作前先加载 novelcraft-core skill, 再按任务加载对应领域 skill。"
    complete: true
    includeRuntimeContext: false

# DSH 原生 Skill provider + model-facing consumer。只扫描本包现有 9 册 Skill；
# baseUrl 是当前 preset 目录，source-only profile 因而无需复制或自建 Skill runtime。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: novelcraft
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

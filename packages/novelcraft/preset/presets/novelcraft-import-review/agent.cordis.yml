# NovelCraft 导入复核代理 — 基于官方 minimal 样例的最小组合(工具面按需裁剪)。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: "你是 NovelCraft 的导入复核代理。任务: 深度导入完成后, 依 novelcraft-imports 与 novelcraft-core skill 的纪律, 清点待处理建议(对象/别名/关系/Scene/结构), 按来源 Scene 与证据分组呈现, 解释每组的来源、影响与冲突点; 低置信与无法消歧项保持待处理。任何采用/忽略都等作者明确决定。"
    complete: true
    includeRuntimeContext: false

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: novelcraft
    includeDefaultRoots: false
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

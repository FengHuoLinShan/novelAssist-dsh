# 开发模式 profile patch 示例(挂载阶段 A 已落地, ADR-0017)。
# @novelcraft/dsh 是唯一 DSH 接触面: 一个 Cordis 服务插件, 内部完成
# llm/approval/storage-domain/jobs/vault 绑定/工具 六类 seam 适配
# (见 packages/novelcraft/dsh/README.md「seam 适配矩阵」)。
# storage/llm/approval/jobs/credentials/tools 等 DSH 官方服务由 profile
# bundle 提供, 不在此重复列出。

- insert:
    - id: novelcraft
      name: "@novelcraft/dsh"
      config:
        llm:
          provider: deepseek        # 内容手默认路由(运行时 DSH 模型切换可覆盖)
          model: deepseek-v4-flash
        vaultsDir: ~/Novels         # 每书一个子文件夹(D17)
        watch:
          enabled: false            # 雷达低频巡检默认关(D6)
          intervalMinutes: 60
    - id: novelcraft-client
      name: "@novelcraft/dsh-client"

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build packages (topological order)
        run: |
          for p in vault trace store llm-step rag memory context assistant outline world writing imports dsh client; do
            npm run build -w @novelcraft/$p
          done
      - run: npm test
      - run: npm run typecheck

[project]
name = "ai-novel-structural-engine"
version = "2.0.0"
description = "AI 长篇小说结构化创作引擎 — 面向中文长篇小说的结构化创作系统"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Novel Engine Team"},
]

keywords = [
    "novel",
    "writing",
    "structured-creation",
    "fastapi",
    "ai-writing",
    "long-fiction",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Writers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Creative Writing",
    "Topic :: Text Processing",
]

dependencies = [
    "authlib>=1.7.0,<1.8",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.42.0,<2.0",
    "chardet>=7.5.1",
    "ebooklib>=0.18.0",
    "fastapi>=0.141.1",
    "email-validator>=2.0.0,<3.0",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.19.0",
    "pgvector>=0.3.0",
    "pillow>=12.3.0,<13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "openai>=2.53.0",
    "httpx>=0.27.0",
    "cryptography>=50.0.0",
    "tiktoken>=0.6.0",
    "rapidfuzz>=3.0",
    "itsdangerous>=2.2.0,<2.3",
    "joserfc>=1.7.4,<2.0",
    "pypinyin>=0.50",
]

[project.optional-dependencies]
ci = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.27.0",
    "ruff>=0.16.2",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "httpx>=0.27.0",
    "ruff>=0.16.2",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=5.7.0",
    "joblib>=1.3.0",
]
eval = [
    "ragas==0.4.3",
    # Ragas 0.4.3 imports a module removed by langchain-community 0.4.2.
    "langchain-community==0.4.2",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "evals*", "shared*", "infrastructure*", "modules*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "modules",
    "infrastructure",
    "tests/unit",
    "tests/integration",
    "tests/modules",
    "tests/prompt_contracts",
    "tests/test_api.py",
    "tests/test_outline_api.py",
    "tests/test_world_testonly_route.py",
]
addopts = [
    "--strict-markers",
    "-m",
    "not e2e and not real_llm and not external_data",
]
python_files = ["tests.py", "*_test.py", "test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "error::authlib.deprecate.AuthlibDeprecationWarning",
]
markers = [
    "api: API layer tests",
    "integration: Integration/flow tests",
    "e2e: end-to-end tests requiring PostgreSQL/pgvector",
    "real_llm: tests that call a real LLM provider; disabled by default",
    "external_data: tests that require an explicitly supplied local source file",
]

[tool.coverage.run]
source = ["app", "core", "shared", "infrastructure", "modules"]
omit = [
    "*/tests/*",
    "*/tests.py",
    "*/*_test.py",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 85.0
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
